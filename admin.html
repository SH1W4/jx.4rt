<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JX.4RT - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #080808;
            --bg: #0a0a0a;
            --bg-surface: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-muted: #606060;
            --border: #1a1a1a;
            --border-light: #252525;
        }

        body {
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-surface);
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-primary);
        }

        .classification-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 2px;
        }

        .badge-standard {
            background: #2a2a2a;
            color: var(--text-muted);
        }

        .badge-qualified {
            background: #3a5a3a;
            color: #8fbc8f;
        }

        .badge-high-value {
            background: #5a4a3a;
            color: #d4a574;
        }

        .badge-signature {
            background: #5a3a5a;
            color: #d474a5;
        }

        .leads-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .leads-table th,
        .leads-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .leads-table th {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .leads-table td {
            font-size: 0.85rem;
        }

        .leads-table tr:hover {
            background: var(--bg-surface);
        }

        .score-bar {
            width: 100px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: var(--text-primary);
            transition: width 0.3s ease;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.25rem 0.5rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-small:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .lead-detail {
            background: var(--bg-surface);
            padding: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .detail-section h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .detail-item {
            margin-bottom: 0.5rem;
        }

        .detail-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-value {
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
        }

        .back-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>JX.4RT Admin Panel</h1>
            <p class="subtitle">Lead Intelligence Dashboard</p>
        </header>

        <div id="dashboard">
            <!-- Analytics Section -->
            <div class="analytics-grid" id="analytics"></div>

            <!-- Leads Table -->
            <h3 style="margin-bottom: 1rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">All Leads</h3>
            <table class="leads-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Classification</th>
                        <th>Score</th>
                        <th>Source</th>
                        <th>Investment</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="leads-table-body"></tbody>
            </table>
        </div>

        <div id="lead-detail" style="display: none;">
            <a href="#" class="back-btn" onclick="showDashboard()">← Back to Dashboard</a>
            <div id="lead-detail-content"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="intake.js"></script>
    <script>
        // Admin Panel Logic
        const AdminPanel = {
            init() {
                this.loadAnalytics();
                this.loadLeads();
            },

            loadAnalytics() {
                const analytics = LeadIntelligence.getAnalytics();
                const container = document.getElementById('analytics');
                
                container.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Total Leads</div>
                        <div class="stat-value">${analytics.total}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Standard</div>
                        <div class="stat-value">${analytics.byClassification.STANDARD}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Qualified</div>
                        <div class="stat-value">${analytics.byClassification.QUALIFIED}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">High Value</div>
                        <div class="stat-value">${analytics.byClassification.HIGH_VALUE}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Signature</div>
                        <div class="stat-value">${analytics.byClassification.SIGNATURE}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Avg Score</div>
                        <div class="stat-value">${analytics.averageScore.toFixed(1)}</div>
                    </div>
                `;
            },

            loadLeads() {
                const leads = LeadIntelligence.getLeads();
                const tbody = document.getElementById('leads-table-body');
                
                if (leads.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9" class="empty-state">No leads yet</td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = leads.map(lead => `
                    <tr>
                        <td><code style="font-size: 0.75rem;">${lead.id}</code></td>
                        <td>${lead.identity.name}</td>
                        <td>${lead.identity.email}</td>
                        <td><span class="classification-badge badge-${this.getClassificationClass(lead.intelligence.classification)}">${lead.intelligence.classification}</span></td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <span style="font-size: 0.8rem;">${lead.intelligence.score}</span>
                                <div class="score-bar">
                                    <div class="score-fill" style="width: ${lead.intelligence.score}%"></div>
                                </div>
                            </div>
                        </td>
                        <td>${lead.acquisition.source || '-'}</td>
                        <td>${lead.investment.range || '-'}</td>
                        <td>${new Date(lead.createdAt).toLocaleDateString()}</td>
                        <td>
                            <div class="actions">
                                <button class="btn-small" onclick="viewLead('${lead.id}')">View</button>
                                <button class="btn-small" onclick="deleteLead('${lead.id}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            },

            getClassificationClass(classification) {
                const classes = {
                    'STANDARD': 'standard',
                    'QUALIFIED': 'qualified',
                    'HIGH_VALUE': 'high-value',
                    'SIGNATURE': 'signature'
                };
                return classes[classification] || 'standard';
            }
        };

        function viewLead(leadId) {
            const leads = LeadIntelligence.getLeads();
            const lead = leads.find(l => l.id === leadId);
            
            if (!lead) return;

            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('lead-detail').style.display = 'block';
            
            const content = document.getElementById('lead-detail-content');
            content.innerHTML = `
                <div class="lead-detail">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1rem;">Lead: ${lead.id}</h3>
                    
                    <div class="detail-grid">
                        <div class="detail-section">
                            <h4>Identity</h4>
                            <div class="detail-item">
                                <div class="detail-label">Name</div>
                                <div class="detail-value">${lead.identity.name}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Instagram</div>
                                <div class="detail-value">${lead.identity.instagram || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Email</div>
                                <div class="detail-value">${lead.identity.email}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">City</div>
                                <div class="detail-value">${lead.identity.city || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Country</div>
                                <div class="detail-value">${lead.identity.country || '-'}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Project</h4>
                            <div class="detail-item">
                                <div class="detail-label">Description</div>
                                <div class="detail-value">${lead.project.description}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Body Area</div>
                                <div class="detail-value">${lead.project.bodyArea || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Size</div>
                                <div class="detail-value">${lead.project.size || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Timeline</div>
                                <div class="detail-value">${lead.project.timeline || '-'}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Intention</h4>
                            <div class="detail-item">
                                <div class="detail-label">Importance</div>
                                <div class="detail-value">${lead.intention.importance}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Meaning</div>
                                <div class="detail-value">${lead.intention.meaning}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Authorship</h4>
                            <div class="detail-item">
                                <div class="detail-label">Level</div>
                                <div class="detail-value">${lead.authorship.level || '-'}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Logistics</h4>
                            <div class="detail-item">
                                <div class="detail-label">Traveling</div>
                                <div class="detail-value">${lead.logistics.traveling ? 'Yes' : 'No'}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Investment</h4>
                            <div class="detail-item">
                                <div class="detail-label">Range</div>
                                <div class="detail-value">${lead.investment.range || '-'}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Acquisition</h4>
                            <div class="detail-item">
                                <div class="detail-label">Source</div>
                                <div class="detail-value">${lead.acquisition.source || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Why JX.4RT</div>
                                <div class="detail-value">${lead.acquisition.whyJx4rt || '-'}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Intelligence</h4>
                            <div class="detail-item">
                                <div class="detail-label">Score</div>
                                <div class="detail-value">${lead.intelligence.score}/100</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Classification</div>
                                <div class="detail-value">
                                    <span class="classification-badge badge-${AdminPanel.getClassificationClass(lead.intelligence.classification)}">${lead.intelligence.classification}</span>
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Complexity</div>
                                <div class="detail-value">${lead.intelligence.complexity}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Artistic Fit</div>
                                <div class="detail-value">${lead.intelligence.artisticFit}/10</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Commercial Potential</div>
                                <div class="detail-value">${lead.intelligence.commercialPotential}/10</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Recommended Action</div>
                                <div class="detail-value">${lead.intelligence.recommendedAction}</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h4>Status</h4>
                            <div class="detail-item">
                                <div class="detail-label">Current Status</div>
                                <div class="detail-value">${lead.status}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Created</div>
                                <div class="detail-value">${new Date(lead.createdAt).toLocaleString()}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showDashboard() {
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('lead-detail').style.display = 'none';
            AdminPanel.init();
        }

        function deleteLead(leadId) {
            if (!confirm('Are you sure you want to delete this lead?')) return;
            
            const storageKey = JX_CONFIG?.system?.localStorageKey || 'jx4rt_leads';
            const leads = LeadIntelligence.getLeads();
            const filtered = leads.filter(l => l.id !== leadId);
            localStorage.setItem(storageKey, JSON.stringify(filtered));
            
            AdminPanel.init();
        }

        // Initialize
        AdminPanel.init();
    </script>
</body>
</html>
